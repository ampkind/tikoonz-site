<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"><title>Visual Studio — TIKOONZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}.studio{position:fixed;inset:0;background:#000}.studio canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 30%,rgba(0,0,0,.12) 65%,rgba(0,0,0,.5) 100%)}.top{position:absolute;z-index:4;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:-.05em;font-size:20px}.back{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;padding:10px 12px;text-decoration:none;font-size:10px;letter-spacing:.12em;backdrop-filter:blur(10px)}.controls{position:absolute;z-index:5;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.48);backdrop-filter:blur(14px);max-width:calc(100vw - 24px)}button,.upload{appearance:none;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.08);color:#fff;padding:12px 14px;font:700 10px/1 Arial,sans-serif;letter-spacing:.1em;white-space:nowrap;cursor:pointer}.upload input{display:none}.full{background:#fff;color:#000}.hint{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .35s}.hint strong{display:block;font-size:clamp(26px,6vw,70px);letter-spacing:-.05em}.hint span{display:block;margin-top:12px;font-size:10px;letter-spacing:.16em;opacity:.6}.loaded .hint{opacity:0}.track{position:absolute;z-index:4;left:max(14px,env(safe-area-inset-left));bottom:max(82px,calc(env(safe-area-inset-bottom) + 70px));font-size:10px;letter-spacing:.12em;opacity:.7;max-width:65vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:640px){.brand{font-size:17px}.controls{gap:5px;padding:6px}.controls button,.controls .upload{padding:11px 10px;font-size:8px}.top{top:max(9px,env(safe-area-inset-top))}.track{bottom:max(74px,calc(env(safe-area-inset-bottom) + 64px))}}@media(orientation:portrait) and (max-width:640px){.hint strong{font-size:12vw}.hint span::after{content:" · BEST IN LANDSCAPE"}}
:fullscreen .top{opacity:.25;transition:opacity .25s}:fullscreen .top:hover,:fullscreen .top:focus-within{opacity:1}
</style></head><body><main class="studio" id="studio"><canvas id="visual"></canvas><div class="shade"></div><div class="top"><div class="brand">TIKOONZ / VISUAL STUDIO</div><a class="back" id="back" href="./releases.html">← RELEASES</a></div><div class="hint"><strong>MUSIC BECOMES VISUAL.</strong><span>UPLOAD MUSIC · TOUCH PLAY · FULL SCREEN</span></div><div class="track" id="track">NO MUSIC LOADED</div><div class="controls"><label class="upload">UPLOAD MUSIC<input id="file" type="file" accept="audio/*"></label><button id="play" type="button">PLAY</button><button id="full" class="full" type="button">FULL SCREEN</button></div><audio id="audio" playsinline preload="metadata"></audio></main>
<script>
(()=>{const studio=document.getElementById('studio'),canvas=document.getElementById('visual'),ctx=canvas.getContext('2d'),audio=document.getElementById('audio'),file=document.getElementById('file'),play=document.getElementById('play'),full=document.getElementById('full'),track=document.getElementById('track'),back=document.getElementById('back');const lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('tikoonz_lang_v4')||'ko';back.href='./releases.html?lang='+encodeURIComponent(lang);let ac,analyser,data,src,objURL,t=0,w=0,h=0,dpr=Math.min(devicePixelRatio||1,2);function size(){w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size,{passive:true});size();function setup(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();analyser=ac.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.82;data=new Uint8Array(analyser.frequencyBinCount);src=ac.createMediaElementSource(audio);src.connect(analyser);analyser.connect(ac.destination)}async function toggle(){if(!audio.src){file.click();return}setup();if(ac.state==='suspended')await ac.resume();if(audio.paused){await audio.play();play.textContent='PAUSE'}else{audio.pause();play.textContent='PLAY'}}file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(objURL)URL.revokeObjectURL(objURL);objURL=URL.createObjectURL(f);audio.src=objURL;track.textContent=f.name;studio.classList.add('loaded');play.textContent='PLAY'});play.addEventListener('click',toggle);audio.addEventListener('ended',()=>play.textContent='PLAY');async function goFull(){try{if(!document.fullscreenElement){await studio.requestFullscreen?.();try{await screen.orientation?.lock?.('landscape')}catch(e){}}else await document.exitFullscreen?.()}catch(e){}}full.addEventListener('click',goFull);document.addEventListener('fullscreenchange',()=>full.textContent=document.fullscreenElement?'EXIT FULL SCREEN':'FULL SCREEN');function draw(){t+=.012;ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);let energy=.16;if(analyser){analyser.getByteFrequencyData(data);let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];energy=sum/(data.length*255)}for(let j=0;j<18;j++){ctx.beginPath();for(let i=0;i<=150;i++){const px=w*i/150;const amp=h*(.018+energy*.12);const yy=h*(.18+j*.038)+Math.sin(i*.085+t*(1.2+energy*3)+j*.65)*amp+Math.sin(i*.031-t*.7+j)*amp*.55;if(i===0)ctx.moveTo(px,yy);else ctx.lineTo(px,yy)}const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,`rgba(0,210,255,${.18+energy*.65})`);g.addColorStop(.5,`rgba(255,0,220,${.28+energy*.7})`);g.addColorStop(1,`rgba(80,60,255,${.18+energy*.65})`);ctx.strokeStyle=g;ctx.lineWidth=1+energy*2.4;ctx.shadowBlur=12+energy*35;ctx.shadowColor='rgba(255,0,220,.7)';ctx.stroke()}requestAnimationFrame(draw)}draw();})();
</script></body></html>
