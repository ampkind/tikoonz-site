function levels(){if(!AN)return [.28+.12*Math.sin(t*2),.22+.1*Math.sin(t*1.3),.18+.08*Math.sin(t*3)];AN.getByteFrequencyData(FREQ);let avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=FREQ[i];return s/(b-a)/255};return[avg(1,20),avg(20,80),avg(80,220)]}
const dots=Array.from({length:900},()=>({a:Math.random()*6.283,r:Math.random(),z:Math.random(),q:Math.random(),p:Math.random()*6.283,v:.35+Math.random()*2.4,w:.3+Math.random()*2.8,side:Math.random()>.5?1:-1}));
function clear(){X.fillStyle='rgba(0,0,0,.22)';X.fillRect(0,0,W,H)}
function space(b,m,h){clear();let cx=W/2,cy=H/2;for(let d of dots){d.z-=.002+b*.055*drive;if(d.z<.05)d.z=1;let r=(1-d.z)*(1-d.z)*Math.max(W,H)*.8*d.r,a=d.a+t*.03,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,s=.7+d.q*2.2+h*3;X.fillStyle=col(.35+(1-d.z)*.65,d.q);X.fillRect(x,y,s,s)}}
function crystal(b,m,h){clear();let cx=W/2,cy=H/2;X.save();X.translate(cx,cy);X.globalCompositeOperation='lighter';for(let k=0;k<24;k++){let snap=Math.pow(Math.max(0,Math.sin(t*(2.5+(k%6)*.31)+k*.81)),14);let r=18+k*19+b*(45+(k%4)*28)*drive+snap*b*110,N=3+k%7;X.beginPath();for(let i=0;i<=N;i++){let a=i/N*6.283+t*.035*(k%3-1)+Math.sin(t*(.7+(k%5)*.16)+k)*m*.16+twist*(k%2?1:-1)*.08,rr=r*(1+Math.sin(t*(1.2+(k%4)*.3)+i+k)*m*.22),px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?X.lineTo(px,py):X.moveTo(px,py)}X.strokeStyle=col(.12+(24-k)*.018,k*.08);X.lineWidth=.55+h*2.6*drive;X.shadowBlur=15+h*35;X.shadowColor=col(.9,k*.11);X.stroke()}X.restore()}
function liquid(b,m,h){
 clear(); X.globalCompositeOperation='lighter';

   let ph=j*.71, baseY=H*(.08+j/(bands-1)*.84);

function tunnel(b,m,h){
 clear(); X.globalCompositeOperation='lighter'; let cx=W/2,cy=H/2;

 clear(); let cx=W/2,cy=H/2; X.globalCompositeOperation='lighter';

function fractal(b,m,h){clear();let cx=W/2,cy=H/2;X.save();X.translate(cx,cy);X.globalCompositeOperation='lighter';for(let r=0;r<16;r++){let N=6+(r%5)*2,R=22+r*27+b*150*drive;for(let i=0;i<N;i++){let a=i/N*6.283+t*.08*(r%2?1:-1),xx=Math.cos(a)*R,yy=Math.sin(a)*R;X.save();X.translate(xx,yy);X.rotate(a+t*.2);X.strokeStyle=col(.08+(16-r)*.018,(r+i)*.06);X.lineWidth=.7+h*2;X.strokeRect(-R*.09,-R*.09,R*.18,R*.18);X.restore()}}X.restore()}

     let rr=r*(1+Math.sin(i*2.17+k+t*1.3)*(.06+m*.12));

     i?X.lineTo(x,y):X.moveTo(x,y);
   }
   X.strokeStyle=col(.16+h*.10,k*.087+t*.004);
   X.lineWidth=.45+b*1.25; X.shadowBlur=13+h*21;
   X.shadowColor=col(.42,k*.091); X.stroke();
 }
 // fractured inner facets
 for(let q=0;q<18;q++){
   let a=q*.91+t*.035*(q%2?1:-1), rr=25+(q%6)*17+b*30;
   X.beginPath(); X.moveTo(cx,cy);
   X.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.75);
   X.strokeStyle=col(.15+h*.08,q*.077); X.lineWidth=.45+b*.8; X.stroke();
 }
 X.globalCompositeOperation='source-over'
}

function choreograph(b,m,h,db,dm,dh){
 let e=b*.48+m*.34+h*.18;
 energyEMA=energyEMA*.90+e*.10;
 energySlow=energySlow*.985+e*.015;
 let rise=energyEMA-energySlow;
 let next=section;
 if(energyEMA<.16) next='CALM';
 else if(rise>.075 && energyEMA>.32) next='BUILD';
 else if(db>.07 && b>.52 && energyEMA>.40) next='DROP';
 else if(energyEMA>.55) next='CLIMAX';
 else if(rise<-.06) next='RELEASE';
 else next='GROOVE';
 if(next!==section){
   section=next; sectionHold=0; sectionEl.textContent='CHOREOGRAPHY · '+section;
   if(section==='DROP'){dropHit=1;blackout=0}
 } else sectionHold++;
 dropHit*=.88;
}
let lastBass=0,lastMid=0,lastHigh=0;
function loop(now){

 let db=b-lastBass, dm=m-lastMid, dh=h-lastHigh;
 lastBass=b; lastMid=m; lastHigh=h;

 // Music events: kick/bass = impact, mid rise = expansion, highs = flash.

 if(dh>.035 && h>.22) flash=Math.min(.22,flash+.08+dh*.4);
 bassKick*=.78; pulse*=.86; flash*=.82; jerk*=.80; twist*=.88;

 // AUTO DIRECTOR: react to musical events as well as phrase time.
 let elapsed=now-last;

   last=now;

   let next=candidates[Math.floor(Math.random()*candidates.length)];
   if(next===scene) next=(next+1)%7;
   select(next,true);
   bassKick=1.25; pulse=1; flash=.16;
 }

 // Camera impact. Bass changes scale and position rather than merely shaking.
 let shake=bassKick*(4+13*b);
 let targetX=(section==='BUILD'?Math.sin(t*.43)*34:section==='CLIMAX'?Math.sin(t*.77)*55:0);
 let targetY=(section==='RELEASE'?Math.cos(t*.31)*28:section==='DROP'?-34*b:0);
 camX+=(targetX-camX)*.035; camY+=(targetY-camY)*.035;
 camRot+=(((section==='CLIMAX'?Math.sin(t*.41)*.018:0))-camRot)*.025;
 let zoom=1+bassKick*(.018+.07*b)+pulse*.018*m+(section==='DROP'?dropHit*.055:0);
 X.save();

 X.translate(-W/2+camX+Math.sin(t*81)*shake,-H/2+camY+Math.cos(t*67)*shake*.72);

 let secGain=section==='CALM'?.88:section==='BUILD'?1.08:section==='DROP'?1.48:section==='CLIMAX'?1.34:section==='RELEASE'?.96:1.12;
 let bb=Math.min(1,b*drive*secGain), mm=Math.min(1,m*drive*secGain), hh=Math.min(1,h*drive*secGain);
 if(transitioning){
   // Long eased overlap: old world dissolves while new world grows inside it.
   trans=Math.min(1,trans+(section==='DROP'?.014:section==='CLIMAX'?.011:.0065));
   let e=trans*trans*(3-2*trans);
   X.save(); X.globalAlpha=Math.max(.18,1-e*.82); draw[prevScene](bb*(1-e*.12),mm,hh); X.restore();
   X.save(); X.globalAlpha=Math.min(1,.22+e*.92); draw[nextScene](bb*(.90+e*.18),mm,hh); X.restore();
   if(trans>=1){scene=nextScene;prevScene=scene;transitioning=false;status.textContent=names[scene]+' · ACTIVE'}
 } else draw[scene](bb,mm,hh);
 X.restore();


 // Radial transient spokes removed.

}
