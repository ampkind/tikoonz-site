  <style>
    :root{
      --max:1120px;
      --bg:#0b0b0f;
      --card:#141420;
      --line:rgba(255,255,255,.10);

    body{ background:var(--bg); }

    header{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(10px);

      border-bottom:1px solid var(--line);

    }
    .headInner{
  max-width:var(--max);
  margin:0 auto;
  padding:34px 24px 26px;
  display:flex;
  flex-direction:column;       /* 로고 위, 네비 아래 */
  align-items:center;          /* 가운데 정렬 */
  justify-content:center;
  gap:22px;                    /* 로고-네비 간격 */
}

.brand{
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.brand img{

  width:auto;
  display:block;
}

nav.primaryNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  font-size:16px;
  color:var(--text2);
  flex-wrap:wrap;
}
nav.primaryNav a{
  cursor:pointer;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid transparent;
}
nav.primaryNav a:hover{
  border-color:var(--line2);
  background:rgba(255,255,255,.03);
}

/* Mobile */
@media (max-width:640px){
  .headInner{padding:18px 14px 14px; gap:12px;}
  .brand img{height:56px;}
  nav.primaryNav{gap:14px; font-size:13px;}
  nav.primaryNav a{

}

.wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:44px 24px 24px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 18px 60px rgba(0,0,0,.35);
    }
    .ratio{
      position:relative;
      width:100%;
      padding-top:56.25%;
      background:#000;
    }
    iframe.video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    .caption{
      padding:18px 22px;
      border-top:1px solid var(--line);
      color:var(--text2);
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
  
    .sound-toggle{
      position:absolute;
      right:18px;
      bottom:18px;
      z-index:20;
      padding:10px 16px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(0,0,0,.55);
      color:#fff;
      border-radius:999px;
      font-size:12px;
      letter-spacing:.12em;
      cursor:pointer;
      backdrop-filter:blur(8px);
      transition:.25s;
    }

    .sound-toggle:hover{
      background:rgba(255,255,255,.12);
    }


/* TIKOONZ v2 final polish */

}

.btn{

/* Synced language controls */
.langToggle, .langInline{display:flex;gap:10px;align-items:center;margin:14px 0 16px;}
.langToggle button, .langInline button{

}
.langToggle button[aria-pressed="true"], .langInline button.active{

}


/* Global top-right language switch */

  gap:8px;

}

  border-color:rgba(255,255,255,.38);
  background:rgba(255,255,255,.08);
}
@media(max-width:640px){

    right:12px;
  }
  .globalLang button{

</style>

<script>
(function(){
  window.TIKOONZ_LANG_KEY = 'tikoonz_lang';

  window.getTikoonzLang = function(){
    try{
      const saved = localStorage.getItem(window.TIKOONZ_LANG_KEY);
      if(saved === 'en' || saved === 'ko') return saved;
    }catch(e){}
    const nav = (navigator.language || 'ko').toLowerCase();
    return nav.startsWith('en') ? 'en' : 'ko';
  };

  window.saveTikoonzLang = function(lang){
    try{ localStorage.setItem(window.TIKOONZ_LANG_KEY, lang); }catch(e){}
  };

  window.updateLangButtons = function(lang){
    const btnEn = document.getElementById('btnEn');
    const btnKo = document.getElementById('btnKo');
    if(btnEn) btnEn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    if(btnKo) btnKo.setAttribute('aria-pressed', lang === 'ko' ? 'true' : 'false');
  };
})();
</script>

</head>

<body>


<header class="siteHeader">
  <div class="headInner">
    <a class="brand" href="./index.html">
      <img src="./assets/logo.png" alt="TIKOONZ">

    <nav class="primaryNav" aria-label="Primary">

    <div class="globalLang" role="group" aria-label="Language">

      <button id="btnKo" type="button" aria-pressed="false">KO</button>
    </div>
  </div>
</header>


<main class="wrap">
  <section class="card">
    <div class="ratio">
      <!-- AUTOPLAY + LOOP + SOUND (best effort, no visible sound button) -->

        id="vimeoPlayer"
        class="video"
        src="https://player.vimeo.com/video/1195365525?autoplay=1&muted=1&loop=1&title=0&byline=0&portrait=0&api=1&background=0"
        title="ICE UNICORN BLUESKY"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>

      <button class="sound-toggle" id="soundBtn">
        SOUND ON

    </div>

</main>


<script src="https://player.vimeo.com/api/player.js"></script>

<script>
  const iframe = document.getElementById('vimeoPlayer');
  const player = new Vimeo.Player(iframe);
  const btn = document.getElementById('soundBtn');

  btn.addEventListener('click', async () => {
    try {
      await player.setVolume(1);
      await player.setMuted(false);
      btn.innerText = 'SOUND OFF';

      btn.onclick = async () => {
        await player.setMuted(true);
        btn.innerText = 'SOUND ON';

        btn.onclick = async () => {
          await player.setMuted(false);
          btn.innerText = 'SOUND OFF';
        };
      };

    } catch(e){
      console.log(e);
    }
  });
</script>



<script>
(function(){
  function setLang(lang){
    lang = lang === 'en' ? 'en' : 'ko';
    document.documentElement.lang = lang;
    updateLangButtons(lang);
    saveTikoonzLang(lang);
  }
  document.getElementById('btnEn').addEventListener('click',()=>setLang('en'));
  document.getElementById('btnKo').addEventListener('click',()=>setLang('ko'));
  setLang(getTikoonzLang());
})();
</script>
