<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Official Releases — TIKOONZ</title>
<meta name="description" content="TIKOONZ Listen / Stream — ICE UNICORN" />
<link rel="stylesheet" href="./assets/style.css" />
<style>
:root{
  --max:1120px;
  --bg:#0b0b0f;
  --card:#141420;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --text2:rgba(255,255,255,.78);
  --radius:16px;
}
body{ background:var(--bg); }
header{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(10px);
  background:rgba(11,11,15,.72);
  border-bottom:1px solid var(--line);
}
.headInner{
  max-width:var(--max); margin:0 auto;
  padding:34px 24px 26px;
  display:flex; flex-direction:column;
  align-items:center; gap:22px;
}
.brand img{ height:82px; }
nav.primaryNav{ display:flex; gap:28px; color:var(--text2); }
nav.primaryNav a{ padding:8px 10px; border-radius:10px; }
nav.primaryNav a.active{ border:1px solid var(--line2); }
.wrap{ max-width:var(--max); margin:0 auto; padding:44px 24px 24px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); }
.inner{ padding:32px 26px 30px; max-width:860px; }
.grid{ display:grid; grid-template-columns:320px 1fr; gap:22px; }
.logoBox{ border:1px solid var(--line); border-radius:14px; padding:18px; }
.logoBox img{ width:100%; max-width:260px; }
.kicker{ font-size:12px; letter-spacing:.22em; color:var(--text2); }
h1{ font-size:24px; margin:0 0 14px; }
.tagRow{ display:flex; gap:8px; margin:12px 0 18px; }
.tag{ font-size:12px; padding:8px 10px; border-radius:999px; border:1px solid var(--line2); }
.copy p{ font-size:16px; line-height:1.88; margin:0 0 16px; }
.sectionTitle{ margin:24px 0 10px; font-size:12px; letter-spacing:.22em; color:var(--text2); }
.table{ width:100%; border:1px solid var(--line); border-radius:14px; }
.table th,.table td{ padding:12px 14px; font-size:14px; }
.ctaRow{ margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; }
.btn{ padding:10px 12px; border-radius:12px; border:1px solid var(--line2); text-decoration:none; }
.btn.ghost{ color:var(--text2); }

.langToggle{
  margin:14px 0 16px;
  display:flex;
  gap:10px;
}
.langToggle button{
  appearance:none;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
  color:var(--text2);
  padding:8px 10px;
  border-radius:12px;
  font-size:13px;
  cursor:pointer;
}
.langToggle button[aria-pressed="true"]{
  border-color:rgba(255,255,255,.32);
  background:rgba(255,255,255,.06);
  color:#fff;
}

@media (max-width:900px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body class="page-artist">
<header>
  <div class="headInner">
    <a class="brand" href="./index.html"><img src="./assets/logo.png" alt="TIKOONZ"></a>
    <nav class="primaryNav">
      <a href="./about.html">About</a>
      <a href="./artist.html" class="active">Artist</a>
      <a href="./audition.html">Audition</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </div>
</header>
<main class="wrap">
<section class="card"><div class="inner">
<div class="grid">
  <div class="logoBox"><img src="./assets/iceunicorn.png" alt="ICE UNICORN logo"></div>
  <div>
    <div class="kicker">ICE UNICORN</div>
    <h1>Official Releases</h1>
    <div class="tagRow"><span class="tag">Release</span><span class="tag">Streaming</span><span class="tag">TIKOONZ</span></div>

    <div id="ko" class="copy">
      <p>ICE UNICORN의 공식 발매 음원을 감상할 수 있습니다.</p>
    </div>

    <div class="sectionTitle">Official Releases</div>
    <table class="table">
      <tr><th>01</th><td>ICE UNICORN — ICE CRYSTAL <span class="tag" style="margin-left:8px;">Latest</span></td></tr>
      <tr><th>02</th><td>ICE UNICORN — ICE EDM</td></tr>
      <tr><th>03</th><td>ICE UNICORN — ICE COSMOSS</td></tr>
    </table>

    <div class="ctaRow">
      <a class="btn" href="https://ditto.fm/ice-crystal-ice-unicorn" target="_blank" rel="noopener">ICE CRYSTAL</a>
      <a class="btn" href="https://ditto.fm/ice-edm" target="_blank" rel="noopener">ICE EDM</a>
      <a class="btn" href="https://ditto.fm/ice-cosmoss" target="_blank" rel="noopener">ICE COSMOSS</a>
      <a class="btn ghost" href="./artist.html">Back to Artist</a>
    </div>

  </div>
</div>
</div></section>
<footer class="footer-links"><div>© 2025 TIKOONZ</div></footer>
</main>
</body>
</html>
